name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: test (${{ matrix.OS }}, scala ${{ matrix.scala.alias }})
    runs-on: ${{ matrix.OS }}
    strategy:
      matrix:
        OS: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        scala:
          - alias: lts
            version: "3.3.8"
          - alias: latest
            version: "3.10.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore cache
        uses: coursier/cache-action@v6
      - name: setup sbt
        uses: sbt/setup-sbt@v1
      - name: test
        run: sbt "++ ${{ matrix.scala.version }} test"
  format:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Scalafmt check
        run: sbt -v "scalafmtCheckAll; scalafmtSbtCheck;"
